name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

      - name: Check vendored IMAP protocol crate
        env:
          RUSTFLAGS: -A mismatched-lifetime-syntaxes -A clippy::redundant-closure
        run: |
          cargo fmt --manifest-path patches/imap-proto/Cargo.toml -- --check
          cargo clippy --manifest-path patches/imap-proto/Cargo.toml -- -D warnings
          cargo test --manifest-path patches/imap-proto/Cargo.toml

      - name: Check vendored IMAP client crate
        env:
          # Keep upstream rust-imap 2.4 lint debt isolated while denying new warnings.
          RUSTFLAGS: >-
            -A mismatched-lifetime-syntaxes
            -A clippy::redundant-closure
            -A clippy::single-component-path-imports
            -A clippy::redundant-slicing
            -A clippy::write-literal
            -A clippy::derivable-impls
            -A clippy::manual-ok-err
            -A clippy::manual-pattern-char-comparison
            -A clippy::needless-borrows-for-generic-args
            -A clippy::doc-overindented-list-items
            -A clippy::print-with-newline
            -A clippy::extra-unused-lifetimes
            -A clippy::manual-non-exhaustive
        run: |
          cargo fmt --manifest-path patches/imap/Cargo.toml -- --check
          cargo clippy --manifest-path patches/imap/Cargo.toml -- -D warnings
          cargo test --manifest-path patches/imap/Cargo.toml

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@1.83

      - uses: Swatinem/rust-cache@v2

      - run: cargo check
      - run: cargo test

  integration:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.8
        env:
          JAVA_OPTS: "-Dgreenmail.verbose"
        ports:
          - 3143:3143
          - 3025:3025
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/3143'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features integration-tests
