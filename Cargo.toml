[package]
name = "slashmail"
version = "0.6.0"
edition = "2021"
rust-version = "1.83"
description = "CLI for searching, managing, drafting, and bulk-operating on emails via IMAP"
license = "MIT OR Apache-2.0"
authors = ["Michael Wassmer <mikewassmer@protonmail.com>"]
repository = "https://github.com/mwmdev/slashmail"
homepage = "https://github.com/mwmdev/slashmail"
readme = "README.md"
keywords = ["email", "imap", "cli", "search", "draft"]
categories = ["command-line-utilities", "email"]
exclude = [".github/", "CLAUDE.md", "audit.md", "deny.toml", "flake.nix", "flake.lock"]

[dependencies]
imap = "=3.0.0-alpha.15"
imap-proto = "=0.16.7"
native-tls = "0.2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
inquire = "0.9"
comfy-table = "=7.1.3"
mailparse = "0.15"
mime_guess = { version = "2.0.5", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
indicatif = "0.17"
regex = "1"
zeroize = "1"
openssl = { version = "0.10", features = ["vendored"], optional = true }
html2text = "0.15.5"
lettre = { version = "=0.11.19", default-features = false, features = ["builder", "mime03"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
vendored-openssl = ["openssl"]
integration-tests = []

[dev-dependencies]
lettre = { version = "=0.11.19", default-features = false, features = ["builder", "mime03", "smtp-transport", "native-tls"] }
tempfile = ">=3,<3.25"

[profile.release]
lto = true
codegen-units = 1
strip = true
